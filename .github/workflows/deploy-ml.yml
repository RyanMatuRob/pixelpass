name: Deploy ML service to Azure

# Runs when a release lands on main (the release PR is the only path to main) and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'pixelpass-ml-service/**'
      - '.github/workflows/deploy-ml.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Exchanged for a short-lived Azure token, so no publish profile or stored password is needed.
  id-token: write

concurrency:
  group: deploy-ml-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy FastAPI service
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check service syntax
        working-directory: pixelpass-ml-service
        run: |
          python -m py_compile main.py
          python - <<'PY'
          import pathlib
          startup = pathlib.Path('startup.sh').read_bytes()
          if b'\r\n' in startup:
              raise SystemExit('startup.sh contains CRLF line endings; bash cannot run it on Linux.')
          if b'uvicorn main:app' not in startup:
              raise SystemExit('startup.sh does not launch uvicorn.')
          PY

      - name: Verify the model artifact ships
        run: |
          test -f pixelpass-ml-service/models/pixelpass_if_model.joblib
          test -f pixelpass-ml-service/requirements.txt

      # Every value here comes from scripts/setup-azure-oidc.ps1. A missing one fails the run with a
      # clear message before anything is uploaded.
      - name: Check deployment configuration
        env:
          APP_NAME: ${{ vars.AZURE_ML_APP_NAME }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          missing=0
          for pair in \
            "AZURE_ML_APP_NAME=${APP_NAME}" \
            "AZURE_CLIENT_ID=${CLIENT_ID}" \
            "AZURE_TENANT_ID=${TENANT_ID}" \
            "AZURE_SUBSCRIPTION_ID=${SUBSCRIPTION_ID}" \
            "AZURE_RESOURCE_GROUP=${RESOURCE_GROUP}"; do
            if [ -z "${pair#*=}" ]; then
              echo "::error::Repository variable ${pair%%=*} is not set. Run scripts/setup-azure-oidc.ps1."
              missing=1
            fi
          done
          exit ${missing}

      # The platform build is deliberately not used. Oryx compresses its output to
      # /home/site/wwwroot/output.tar.zst and the container never unpacks it, so the app booted with
      # no start-up script and exited 127 (issue #111). Dependencies are resolved here, on the runner,
      # and ship inside the zip next to the source.
      - name: Build the deployment package
        working-directory: pixelpass-ml-service
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/ml-app"
          rm -rf "${stage}"
          mkdir -p "${stage}"
          cp -r main.py startup.sh requirements.txt models "${stage}/"

          python -m pip install --upgrade pip
          python -m pip install \
            --target "${stage}/python-packages" \
            --no-compile \
            --disable-pip-version-check \
            --requirement requirements.txt

          # Byte-code caches are machine specific and only inflate the upload.
          find "${stage}/python-packages" -name '__pycache__' -type d -prune -exec rm -rf {} +
          du -sh "${stage}/python-packages"

          ( cd "${stage}" && zip -qr "${RUNNER_TEMP}/ml-app.zip" . )
          ls -lh "${RUNNER_TEMP}/ml-app.zip"

      # OIDC: Azure trusts a token issued for this repository and environment, so the job never holds
      # a publish profile. SCM basic authentication can stay disabled on the Web App.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Settings live in the repository so a fresh Web App, or a portal edit, cannot silently bring
      # back the Oryx build. The package already carries its dependencies, hence the `false`; the
      # TensorFlow import plus the Facenet warm-up needs more than the 230 s default to bind.
      - name: Configure the Web App runtime
        env:
          APP_NAME: ${{ vars.AZURE_ML_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          az webapp config set --name "${APP_NAME}" --resource-group "${RESOURCE_GROUP}" \
            --startup-file "bash /home/site/wwwroot/startup.sh" \
            --always-on true
          az webapp config appsettings set --name "${APP_NAME}" --resource-group "${RESOURCE_GROUP}" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              WEBSITES_PORT=8000 \
              PYTHONPATH=/home/site/wwwroot/python-packages \
              PYTHONUNBUFFERED=1 \
              WEBSITES_CONTAINER_START_TIME_LIMIT=600

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_ML_APP_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          package: ${{ runner.temp }}/ml-app.zip

      # A green upload only proves the zip arrived. This proves FastAPI is serving, and it allows for
      # the Facenet warm-up that runs inside the lifespan hook.
      - name: Wait for the service to answer
        env:
          APP_NAME: ${{ vars.AZURE_ML_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          host="$(az webapp show --name "${APP_NAME}" --resource-group "${RESOURCE_GROUP}" \
            --query defaultHostName -o tsv)"
          echo "Probing https://${host}/docs"
          for attempt in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://${host}/docs" || true)"
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::https://${host}/docs never returned 200; inspect the container log with 'az webapp log tail'."
          exit 1
