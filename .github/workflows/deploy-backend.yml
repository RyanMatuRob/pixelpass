name: Deploy admin and API to Azure

# Runs when a release lands on main (the release PR is the only path to main) and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'pixelpass-admin/**'
      - 'pixelpass-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Exchanged for a short-lived Azure token, so no publish profile or stored password is needed.
  id-token: write

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

env:
  # Azure App Service runs NODE|22-lts, so build with the same major version.
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    name: Build console and deploy unified app
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            pixelpass-admin/package-lock.json
            pixelpass-backend/package-lock.json

      - name: Install console dependencies
        working-directory: pixelpass-admin
        run: npm ci

      - name: Build console into the backend
        working-directory: pixelpass-admin
        run: npm run build

      - name: Verify the unified bundle
        run: |
          test -f pixelpass-backend/public/index.html
          test -d pixelpass-backend/public/assets
          du -sh pixelpass-backend/public

      - name: Check backend syntax
        working-directory: pixelpass-backend
        run: |
          node --check src/server.js
          node --check src/routes/scan.js

      # Every value here comes from scripts/setup-azure-oidc.ps1. A missing one fails the run with a
      # clear message before anything is uploaded.
      - name: Check deployment configuration
        env:
          APP_NAME: ${{ vars.AZURE_BACKEND_APP_NAME }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          missing=0
          for pair in \
            "AZURE_BACKEND_APP_NAME=${APP_NAME}" \
            "AZURE_CLIENT_ID=${CLIENT_ID}" \
            "AZURE_TENANT_ID=${TENANT_ID}" \
            "AZURE_SUBSCRIPTION_ID=${SUBSCRIPTION_ID}" \
            "AZURE_RESOURCE_GROUP=${RESOURCE_GROUP}"; do
            if [ -z "${pair#*=}" ]; then
              echo "::error::Repository variable ${pair%%=*} is not set. Run scripts/setup-azure-oidc.ps1."
              missing=1
            fi
          done
          exit ${missing}

      # OIDC: Azure trusts a token issued for this repository and environment, so the job never holds
      # a publish profile. SCM basic authentication can stay disabled on the Web App.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_APP_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          package: pixelpass-backend
